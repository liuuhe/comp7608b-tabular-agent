[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabular-verification-agent"
version = "0.1.0"
description = "A tabular data analysis agent with iterative verification."
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain-ollama==1.1.0",
  "langgraph==1.2.18",
  "pandas==2.3.3",
  "numpy>=2.2,<3",
  "matplotlib>=3.9,<4",
  "pydantic==2.14.2",
  "streamlit>=1.40,<2",
  "openpyxl>=3.1,<4",
  "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
tabular-agent = "tabular_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tabular_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["runs", "evaluation/runs", "evaluation/private", "data/uci", ".cache", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
